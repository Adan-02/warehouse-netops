[platformio]
default_envs = esp32dev

[env]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@2.8
    beegee-tokyo/DHT sensor library for ESPx@1.19.0
build_flags =
    -Wall
    -Wextra

[env:esp32dev]
build_flags =
    ${env.build_flags}
    -DWAREHOUSE_SIMULATED_SENSOR=0

[env:esp32dev-simulated]
build_flags =
    ${env.build_flags}
    -DWAREHOUSE_SIMULATED_SENSOR=1

[env:esp32dev-wokwi]
build_flags =
    ${env.build_flags}
    -DWAREHOUSE_SIMULATED_SENSOR=0
    -DWAREHOUSE_WOKWI=1
    -DWAREHOUSE_ALLOW_OPEN_WIFI=1
